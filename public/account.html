<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="account.title">账号中心 - Qxwk 通行证</title>
  <link rel="icon" href="favicon.webp" type="image/webp">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <style>
    .card h3 { font-size: .88rem; font-weight: 600; margin: 18px 0 10px; }
    .card hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="/">
        <img class="brand-logo" src="favicon.webp" alt="">
        <span class="brand-text">
          <b data-i18n="login.welcome">Qxwk 通行证</b>
          <span data-i18n="common.slogan">一处登录，通行各站</span>
        </span>
      </a>
      <div class="navbar-actions">
        <button id="langToggle" class="lang-toggle" type="button" aria-label="切换语言">EN</button>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="切换主题" data-i18n-aria-label="common.theme">◐</button>
        <button id="logoutBtn" class="btn btn-ghost btn-sm" type="button" data-i18n="common.logout">退出登录</button>
      </div>
    </div>
  </header>

  <main>
    <h1 class="page-title" data-i18n="login.welcome">Qxwk 通行证</h1>
    <p class="page-sub" data-i18n="account.sub">管理你的通行证资料、安全设置与授权。</p>

    <div class="account-grid">
      <!-- 资料 -->
      <section class="card">
        <h2 data-i18n="account.profile">个人资料</h2>
        <div class="profile-head">
          <div class="avatar" id="avatar"></div>
          <div>
            <div class="profile-name" id="profileName">—</div>
            <div class="profile-meta">
              <span id="profileEmail">—</span>
              <span id="emailBadge" class="badge hidden"></span>
            </div>
          </div>
        </div>
        <form id="profileForm" novalidate>
          <div class="field">
            <label for="nickname" data-i18n="account.nickname">昵称</label>
            <input class="input" id="nickname" maxlength="20" autocomplete="nickname" required>
          </div>
          <div class="field">
            <label data-i18n="account.color">专属颜色</label>
            <input type="hidden" id="colorInput">
            <div class="color-select" id="colorDots"></div>
          </div>
          <button class="btn btn-primary" type="submit" data-i18n="account.save_profile">保存资料</button>
          <p class="msg" id="profileMsg"></p>
        </form>
      </section>

      <!-- 密码 -->
      <section class="card">
        <h2 data-i18n="account.password">修改密码</h2>
        <form id="passwordForm" novalidate>
          <div class="field">
            <label for="oldPassword" data-i18n="account.old_password">原密码</label>
            <input class="input" id="oldPassword" type="password" autocomplete="current-password" required>
          </div>
          <div class="field">
            <label for="newPassword" data-i18n="account.new_password">新密码</label>
            <input class="input" id="newPassword" type="password" autocomplete="new-password" required>
          </div>
          <div class="field">
            <label for="newPassword2" data-i18n="account.confirm_password">确认新密码</label>
            <input class="input" id="newPassword2" type="password" autocomplete="new-password" required>
          </div>
          <button class="btn btn-primary" type="submit" data-i18n="account.change_password">修改密码</button>
          <p class="msg" id="passwordMsg"></p>
        </form>
      </section>

      <!-- 邮箱 -->
      <section class="card wide">
        <h2 data-i18n="account.email_card">邮箱</h2>
        <p class="muted">
          <span id="emailValue">—</span>
          <span id="emailState" class="badge" style="margin-left:8px"></span>
        </p>

        <div id="verifyBlock" class="hidden">
          <h3 data-i18n="account.verify_now">验证邮箱</h3>
          <div class="input-row">
            <input class="input" id="verifyCode" inputmode="numeric" maxlength="6" placeholder="6 位数字" data-i18n-placeholder="login.code_ph">
            <button class="btn btn-ghost" type="button" id="verifySend" data-i18n="common.send_code">获取验证码</button>
            <button class="btn btn-primary" type="button" id="verifyBtn" data-i18n="account.verify_now">验证邮箱</button>
          </div>
        </div>

        <hr>
        <h3 data-i18n="account.change_email">更换邮箱</h3>
        <p class="small" data-i18n="account.email_hint">邮箱用于验证码登录与找回密码。</p>
        <div class="field" style="margin-top:10px">
          <label for="changePassword" data-i18n="account.email_password">当前密码</label>
          <input class="input" id="changePassword" type="password" autocomplete="current-password">
        </div>
        <div class="field">
          <label for="changeEmail" data-i18n="account.new_email">新邮箱</label>
          <input class="input" id="changeEmail" type="email" autocomplete="email" data-i18n-placeholder="login.email_ph" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="changeCode" data-i18n="login.code">验证码</label>
          <div class="input-row">
            <input class="input" id="changeCode" inputmode="numeric" maxlength="6" data-i18n-placeholder="login.code_ph" placeholder="6 位数字">
            <button class="btn btn-ghost" type="button" id="changeSend" data-i18n="common.send_code">获取验证码</button>
            <button class="btn btn-primary" type="button" id="changeBtn" data-i18n="account.change_email">更换邮箱</button>
          </div>
        </div>
        <p class="msg" id="emailMsg"></p>
      </section>

      <!-- 登录设备 -->
      <section class="card wide">
        <h2>
          <span data-i18n="account.sessions">登录设备</span>
          <span class="hint" data-i18n="account.sessions_hint">这些设备正使用你的通行证。</span>
        </h2>
        <div class="list" id="sessionsList"></div>
        <div style="margin-top:12px">
          <button class="btn btn-ghost btn-sm" type="button" id="revokeOthers" data-i18n="account.revoke_others">下线其他设备</button>
        </div>
        <p class="msg" id="sessionsMsg"></p>
      </section>

      <!-- 已授权应用 -->
      <section class="card wide">
        <h2>
          <span data-i18n="account.grants">已授权应用</span>
          <span class="hint" data-i18n="account.grants_hint">这些应用获得过你的身份授权。</span>
        </h2>
        <div class="list" id="grantsList"></div>
        <p class="msg" id="grantsMsg"></p>
      </section>
    </div>
  </main>

  <footer data-i18n="common.copy">2026 青翔未阔工作室 · Qxwk 通行证</footer>

  <script src="app.js"></script>
  <script src="account.js"></script>
</body>
</html>
