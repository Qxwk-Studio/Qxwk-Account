<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="strict-origin">
<title>Qxwk 通行证</title>
<meta name="description" content="Qxwk 账号通行证 —— 青翔未阔工作室统一账号中心。">
<link rel="icon" type="image/webp" href="/favicon.webp">
<style>
  :root { color-scheme: light; --bg:#f7f7f8; --surface:#ffffff; --text:#171717; --text-muted:#52525b; --border:rgba(23,23,23,.12); --brand:#4b3fe3; --brand-soft:#f2f7ff; --brand-text:#1a1759; }
  :root[data-theme="dark"] { color-scheme: dark; --bg:#0f0f12; --surface:#17171b; --text:#e5e5e5; --text-muted:#a1a1aa; --border:rgba(229,229,229,.12); --brand:#6054f1; --brand-soft:#1a1759; --brand-text:#cfd8ff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font: 400 14px/20px system-ui, -apple-system, "PingFang SC", "Segoe UI", sans-serif; }
  .card { width: 100%; max-width: 360px; margin: 24px; padding: 28px 24px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .loading-spinner { width: 36px; height: 36px; margin: 0 auto; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--brand); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { margin: 12px 0 0; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="loading-spinner" aria-hidden="true"></div>
    <p>正在检查登录状态…</p>
  </div>

<script src="app.js"></script>
<script>
/* 根页分流：有本地会话且 /api/me 校验通过 → 账号中心；否则 → 登录页。
   跨站 SSO（?redirect= 弹层 / 授权确认 / 片段回传）已下线，根页不再承担中控职责。 */
(async function () {
  var token = localStorage.getItem(LS_TOKEN);
  var loggedIn = false;
  if (token) {
    // 直接 fetch /api/me 校验（不走 api()：避免其 401 时整页跳转造成的重复跳转）
    try {
      var res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
      loggedIn = res.status === 200;
      if (!loggedIn) { localStorage.removeItem(LS_TOKEN); localStorage.removeItem(LS_USER); }
    } catch (e) { /* 网络异常：按未登录处理，由登录页兜底 */ }
  }
  location.replace(loggedIn ? 'account.html' : 'login.html');
})();
</script>
</body>
</html>
