<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup</title>
<!-- 刻意不引 style.css：本页是与其它页完全独立的欢迎面板（自有 :root 变量、自有 body、无 navbar），
     与那 104 行公共样式零重叠。引进来只会白白继承 base 的 body { line-height: 1.6; flex-direction: column }，
     而本页 body 是多子元素的 flex 布局且全文未声明 line-height，这两条会真的改变排布，得不偿失 -->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #f0f0f5 0%, #e2e2ec 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  color: #1a1a2e;
  user-select: none;
}

#container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#bg-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

#greeting-container {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}

.greeting-layer {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: opacity 1.2s ease;
}

.greeting-layer svg {
  display: inline-block;
  height: min(260px, 40vw);
  width: auto;
}

.greeting-layer svg path {
  stroke: #1a1a2e !important;
}

</style>
<meta name="color-scheme" content="light dark">
<script src="theme.js"></script>
<style>
  /* 黑夜模式：深色覆盖（跟随主页面主题，iframe 内同步） */
  :root[data-theme="dark"] body {
    background: radial-gradient(ellipse at 50% 40%, #1a1a2e 0%, #0f172a 100%);
    color: #e2e8f0;
  }
    :root[data-theme="dark"] .greeting-layer svg path { stroke: #e2e8f0 !important; }
</style>
</head>
<body>
<div id="container">
  <canvas id="bg-canvas"></canvas>
  <div id="greeting-container">
    <div class="greeting-layer" id="layer-0"></div>
    <div class="greeting-layer" id="layer-1"></div>
  </div>
</div>


<script src="setup.js" defer></script>
</body>
</html>
