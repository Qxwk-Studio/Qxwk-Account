<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="strict-origin">
<title>登录 - 青翔未阔工作室</title>
<meta name="description" content="登录 Qxwk 账号通行证，一处登录，通行各站。">
<link rel="icon" type="image/webp" href="/favicon.webp">
<link rel="stylesheet" href="/base.css">
<style>
  /* ========= 登录/注册：左右分屏 ========= */
  #authView {
    flex: 1;
    display: grid;
    grid-template-columns: 60% 40%;
    overflow: hidden;
  }
  /* 左侧：setup 欢迎动画承载（iframe 无缝填充，与 CityFootprint 一致） */
  .auth-left {
    position: relative;
    height: 100%;
    overflow: hidden;
    background: #e2e2ec;
  }
  .setup-frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .auth-right {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    overflow-y: auto;
  }
  .auth-form {
    width: 100%;
    max-width: 380px;
    margin: 0;
  }
  .auth-title {
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .auth-subtitle {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin-bottom: 28px;
  }

  /* ========= Tabs ========= */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 4px;
    border-radius: var(--radius-sm);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    transition: all var(--transition);
    font-family: inherit;
  }
  .tab:hover { color: var(--text-primary); }
  .tab.active {
    background: var(--surface);
    color: var(--primary);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }

  /* ========= 忘记密码 ========= */
  .forgot-link { margin-top: 12px; text-align: center; }
  .forgot-link a { color: var(--primary); font-size: 0.85rem; text-decoration: none; font-weight: 500; }
  .forgot-link a:hover { text-decoration: underline; }
  .forgot-link.back { margin-top: 16px; }
  .code-row { margin-top: 2px; }

  /* ========= Form ========= */
  label { display: block; font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
  input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--surface);
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  .field { margin-bottom: 16px; }

  /* ========= Buttons ========= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: 40px;
    padding: 11px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
    text-decoration: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff;
    width: 100%;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, var(--primary-hover), #0f766e);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .msg { font-size: 0.84rem; margin-top: 10px; }
  .msg.error { color: #dc2626; }
  .msg.ok { color: #16a34a; }
  .hint { font-size: 0.78rem; color: var(--text-tertiary); margin-top: 4px; }

  /* ========= Footer ========= */
  .footer {
    background: #0f172a;
    text-align: center;
    padding: 14px 24px;
    color: var(--text-tertiary);
    font-size: 0.82rem;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .footer-copy { opacity: 0.6; }

  /* ========= Responsive ========= */
  @media (max-width: 768px) {
    #authView { grid-template-columns: 1fr; grid-template-rows: 28vh 1fr; }
    .auth-left { height: 100%; }
    .auth-right { align-items: flex-start; padding: 40px 16px; }
    .auth-form { max-width: 100%; }
  }
  @media (max-width: 640px) {
    .navbar-inner { padding: 0 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
<meta name="color-scheme" content="light dark">
<script src="theme.js"></script>
<style>
  /* ===== 黑夜模式：主题切换按钮 ===== */
  .theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; background:none; border:none; border-radius:50%; color:var(--text-primary); cursor:pointer; transition:background var(--transition), color var(--transition); position:relative; z-index:5; touch-action:manipulation; }
  .theme-toggle:hover { background:var(--primary-subtle); color:var(--primary); }
  .theme-toggle svg { width:22px; height:22px; }
  .theme-toggle .icon-sun { display:none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display:block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display:none; }

  /* ===== 黑夜模式：深色变量 ===== */
  :root { color-scheme: light; --primary-subtle: rgba(37,99,235,0.08); }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --primary-light: rgba(59,130,246,0.16);
    --primary-subtle: rgba(59,130,246,0.16);
    --surface:#1e293b; --bg:#0f172a;
    --text-primary:#e2e8f0; --text-secondary:#94a3b8; --text-tertiary:#64748b;
    --border:#334155; --navbar-bg:rgba(15,23,42,0.8);
    --shadow-sm:0 1px 3px rgba(0,0,0,0.4); --shadow-md:0 4px 16px rgba(0,0,0,0.5); --shadow-lg:0 12px 40px rgba(0,0,0,0.6);
  }
  :root[data-theme="dark"] .footer { background:#111827; }
  :root[data-theme="dark"] .back-link { background:rgba(59,130,246,0.16); border-color:rgba(96,165,250,0.35); }
  :root[data-theme="dark"] .back-link:hover { background:rgba(59,130,246,0.30); border-color:rgba(96,165,250,0.60); }

  /* ===== 黑夜模式：页面元素覆盖 ===== */
  :root[data-theme="dark"] .auth-right { background: var(--surface); }
  :root[data-theme="dark"] .auth-left { background: #0f172a; }
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <!-- 品牌链接指向通行证主页（根路径，index.html 按登录状态分流到账号中心/登录页），
         不是 Qxwk 工作室官网；去官网走右侧「返回主页」的 back-link，两个链接职责不重叠。
         用 "/" 而不是 "index.html"：直接命中根路径，少一次 /index.html → / 的 307 跳转 -->
    <a href="/" class="navbar-brand">
      <img class="brand-logo" src="/favicon.webp" alt="Qxwk 通行证">
      <span class="brand-text"><b>Qxwk 通行证</b><span>一处登录，通行各站</span></span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="https://home.qxwkstudio.top/" class="back-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        返回主页
      </a>
    </div>
  </div>
</header>

<div id="authView">
  <div class="auth-left">
    <iframe src="setup.html" class="setup-frame" title="欢迎" loading="lazy"></iframe>
  </div>
  <div class="auth-right">
    <div class="auth-form">
      <h2 class="auth-title" id="authTitle">👋 欢迎回来</h2>
      <p class="auth-subtitle" id="authSubtitle">使用 Qxwk 通行证登录，一处登录，通行各站</p>

      <div class="tabs">
        <div class="tab active" id="tabLogin" data-action="switchTab" data-mode="login">登录</div>
        <div class="tab" id="tabReg" data-action="switchTab" data-mode="reg">注册</div>
      </div>

      <form id="loginForm">
        <div class="field"><label>昵称 / 邮箱</label><input id="loginNick" maxlength="100" placeholder="昵称或已绑定的邮箱" required></div>
        <div class="field"><label>密码</label><input id="loginPass" type="password" maxlength="50" placeholder="密码" required></div>
        <button class="btn btn-primary" type="submit" id="loginBtn">登录</button>
        <div class="forgot-link"><a href="#" data-action="showForgot">忘记密码？</a></div>
        <div class="msg" id="loginMsg"></div>
      </form>

      <form id="regForm" style="display:none;">
        <div class="field"><label>昵称</label><input id="regNick" maxlength="20" placeholder="1-20 个字符" required></div>
        <div class="field"><label>密码</label><input id="regPass" type="password" minlength="4" maxlength="50" placeholder="4-50 个字符" required></div>
        <div class="field"><label>确认密码</label><input id="regPass2" type="password" maxlength="50" placeholder="再输入一次" required></div>
        <div class="field" id="inviteField"><label>邀请码</label><input id="regInvite" maxlength="20" required placeholder="请输入邀请码" autocomplete="off"><div class="hint">邀请码：找已注册的朋友要一个，一个邀请码只能注册一次</div></div>
        <div class="msg error" id="invitePausedNotice" style="display:none;">⚠️ 注册已暂停，暂不接受新注册</div>
        <button class="btn btn-primary" type="submit" id="regBtn">注册并登录</button>
        <div class="msg" id="regMsg"></div>
      </form>

      <form id="setPassForm" style="display:none;">
        <div class="field"><label>昵称</label><input id="setPassNick" maxlength="20" readonly></div>
        <div class="field"><label>新密码</label><input id="setPassNew" type="password" minlength="4" maxlength="50" placeholder="4-50 个字符" required></div>
        <div class="field"><label>确认新密码</label><input id="setPassNew2" type="password" maxlength="50" placeholder="再输入一次" required></div>
        <button class="btn btn-primary" type="submit" id="setPassBtn">设置密码并登录</button>
        <div class="msg" id="setPassMsg"></div>
      </form>

      <form id="forgotForm" style="display:none;">
        <div class="field">
          <label>绑定邮箱</label>
          <input id="forgotEmail" type="email" maxlength="100" placeholder="你已绑定并验证的邮箱" required>
        </div>
        <div class="field">
          <button type="button" class="btn btn-primary" id="forgotSendBtn" data-action="sendForgotCode">发送验证码到该邮箱</button>
        </div>
        <div class="code-row" id="forgotCodeRow" style="display:none;">
          <div class="field"><label>验证码</label><input id="forgotCode" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码"></div>
        </div>
        <div class="field"><label>新密码</label><input id="forgotNew" type="password" minlength="4" maxlength="50" placeholder="4-50 个字符" required></div>
        <div class="field"><label>确认新密码</label><input id="forgotNew2" type="password" maxlength="50" placeholder="再输入一次" required></div>
        <button class="btn btn-primary" type="submit" id="forgotBtn">重置密码并登录</button>
        <div class="forgot-link back"><a href="#" data-action="backToLogin">← 返回登录</a></div>
        <div class="msg" id="forgotMsg"></div>
      </form>
    </div>
  </div>
</div>

<footer class="footer"><div class="footer-copy">2026 青翔未阔工作室 · Qxwk 通行证</div></footer>

<script src="app.js"></script>
<script src="login.js" defer></script>
</body>
</html>
