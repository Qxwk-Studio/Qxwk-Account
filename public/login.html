<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="strict-origin">
<title>登录 - 青翔未阔工作室</title>
<meta name="description" content="登录 Qxwk 账号通行证，一处登录，通行各站。">

<style>
  /* ========= Reset & Base ========= */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --secondary: #0d9488;
    --surface: #ffffff;
    --bg: #f8fafc;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --text-tertiary: #94a3b8;
    --border: #e2e8f0;
    --navbar-bg: rgba(255, 255, 255, 0.8);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --container: 1100px;
    --nav-height: 64px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ========= Navbar ========= */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: var(--nav-height);
    background: var(--navbar-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .navbar-inner {
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 100%;
    gap: 12px;
  }
  .navbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.3px;
    transition: opacity var(--transition);
    flex-shrink: 0;
  }
  .navbar-brand:hover { opacity: 0.85; }
  .brand-logo {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    box-shadow: 0 2px 10px rgba(37, 99, 235, 0.25);
  }
  .brand-text { line-height: 1.25; }
  .brand-text b { display: block; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
  .brand-text span { font-size: 11px; color: var(--text-tertiary); }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    background: rgba(37, 99, 235, 0.15);
    color: var(--text-primary);
    text-decoration: none;
    border-radius: 40px;
    font-size: 0.88rem;
    font-weight: 500;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: 1px solid rgba(147, 197, 253, 0.35);
    transition: all var(--transition);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .back-link:hover {
    background: rgba(37, 99, 235, 0.3);
    border-color: rgba(147, 197, 253, 0.6);
    transform: scale(1.02);
  }

  /* ========= 登录/注册：左右分屏 ========= */
  #authView {
    flex: 1;
    display: grid;
    grid-template-columns: 60% 40%;
    overflow: hidden;
  }
  /* 左侧：setup 欢迎动画承载（iframe 无缝填充，与 CityFootprint 一致） */
  .auth-left {
    position: relative;
    height: 100%;
    overflow: hidden;
    background: #e2e2ec;
  }
  .setup-frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .auth-right {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    overflow-y: auto;
  }
  .auth-form {
    width: 100%;
    max-width: 380px;
    margin: 0;
  }
  .auth-title {
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .auth-subtitle {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin-bottom: 28px;
  }

  /* SSO 来源提示条 */
  .sso-banner {
    display: none;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 0.84rem;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .sso-banner.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .sso-banner.warn { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  /* 弹窗模式：banner 内的关闭窗口按钮 */
  .sso-close {
    margin-left: 10px;
    padding: 2px 12px;
    border: 1px solid currentColor;
    border-radius: 999px;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
    vertical-align: middle;
  }
  .sso-close:hover { background: rgba(128, 128, 128, 0.12); }

  /* ========= Tabs ========= */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 4px;
    border-radius: var(--radius-sm);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    transition: all var(--transition);
    font-family: inherit;
  }
  .tab:hover { color: var(--text-primary); }
  .tab.active {
    background: var(--surface);
    color: var(--primary);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }

  /* ========= 忘记密码 ========= */
  .forgot-link { margin-top: 12px; text-align: center; }
  .forgot-link a { color: var(--primary); font-size: 0.85rem; text-decoration: none; font-weight: 500; }
  .forgot-link a:hover { text-decoration: underline; }
  .forgot-link.back { margin-top: 16px; }
  .code-row { margin-top: 2px; }

  /* ========= Form ========= */
  label { display: block; font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
  input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--surface);
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  .field { margin-bottom: 16px; }

  /* ========= Buttons ========= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: 40px;
    padding: 11px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
    text-decoration: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff;
    width: 100%;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, var(--primary-hover), #0f766e);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .msg { font-size: 0.84rem; margin-top: 10px; }
  .msg.error { color: #dc2626; }
  .msg.ok { color: #16a34a; }
  .hint { font-size: 0.78rem; color: var(--text-tertiary); margin-top: 4px; }

  /* ========= Footer ========= */
  .footer {
    background: #0f172a;
    text-align: center;
    padding: 14px 24px;
    color: var(--text-tertiary);
    font-size: 0.82rem;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .footer-copy { opacity: 0.6; }

  /* ========= Responsive ========= */
  @media (max-width: 768px) {
    #authView { grid-template-columns: 1fr; grid-template-rows: 28vh 1fr; }
    .auth-left { height: 100%; }
    .auth-right { align-items: flex-start; padding: 40px 16px; }
    .auth-form { max-width: 100%; }
  }
  @media (max-width: 640px) {
    .navbar-inner { padding: 0 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
/* 主题切换：localStorage('theme') 优先，其次跟随系统 prefers-color-scheme；同步写入 <html> 的 data-theme 防闪烁 */
(function () {
  var KEY = 'theme';
  var root = document.documentElement;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function system() { return mq.matches ? 'dark' : 'light'; }
  function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
  function apply(t) { root.setAttribute('data-theme', t); }
  function current() { return stored() || system(); }
  apply(current());
  function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
  // 按钮轮询绑定（不依赖 DOMContentLoaded，避免被外部脚本阻塞导致按钮长时间无效）
  (function tryBind() {
    var btn = document.getElementById('themeToggle');
    if (btn) btn.addEventListener('click', toggle);
    else setTimeout(tryBind, 50);
  })();
  if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
  else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
  window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
})();
</script>

<script>
/* 登录/注册切换 */
// 表单区当前模式（登录/注册），决定标题与副标题文案
var currentAuthMode = 'login';

function switchTab(mode) {
  currentAuthMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabReg').classList.toggle('active', mode === 'reg');
  document.getElementById('loginForm').style.display = mode === 'login' ? '' : 'none';
  document.getElementById('regForm').style.display = mode === 'reg' ? '' : 'none';
  // 标题随模式切换（需求2）：登录↔注册各自展示对应欢迎词与副标题
  document.getElementById('authTitle').textContent = mode === 'login' ? '👋 欢迎回来' : '👋 欢迎注册';
  document.getElementById('authSubtitle').textContent = mode === 'login'
    ? '使用 Qxwk 通行证登录，一处登录，通行各站'
    : '注册一个通行证账号，一处登录，通行各站';
}

/* ---------- SSO 回调 ---------- */
var redirect = new URLSearchParams(location.search).get('redirect'); // 来源站回调目标
var isPopup = new URLSearchParams(location.search).get('popup') === '1'; // 弹窗模式：登录后 postMessage 回传并自动关窗
var ssoInfo = null; // /api/sso/info 校验结果；null=无 redirect

function validateRedirect(raw) {
  try { var u = new URL(raw); return u.protocol === 'http:' || u.protocol === 'https:'; }
  catch (e) { return false; }
}

/* 弹窗模式回传：向 redirect 的 origin postMessage 发送 token，然后自动关窗。
   不强制校验来源站（未登记站点同样回传，来源仅由后端登录日志记录）；
   仅要求 redirect 是合法 http(s) 链接，targetOrigin 用其 origin。 */
function deliverToken(data) {
  if (!isPopup || !redirect || !window.opener || !validateRedirect(redirect)) return false;
  try {
    window.opener.postMessage({
      type: 'qxwk-sso',
      token: data.token,
      uid: String(data.userId),
      nick: data.nickname,
    }, new URL(redirect).origin);
    window.close();
    return true;
  } catch (e) { return false; }
}

function escapeHtml(t) {
  var d = document.createElement('div');
  d.textContent = t || '';
  return d.innerHTML;
}

function setSsoBanner(html, kind) {
  var b = document.getElementById('ssoBanner');
  b.innerHTML = html;
  b.className = 'sso-banner ' + (kind || 'ok');
  b.style.display = '';
}

async function checkSso() {
  var closeBtn = '<button type="button" class="sso-close" onclick="window.close()">关闭窗口</button>';
  if (!redirect) {
    if (isPopup) setSsoBanner('⚠️ 弹窗登录缺少来源链接，无法回传登录结果 ' + closeBtn, 'warn');
    ssoInfo = null;
    return;
  }
  if (!validateRedirect(redirect)) {
    setSsoBanner(isPopup
      ? '⚠️ 来源链接不合法，无法以弹窗方式登录 ' + closeBtn
      : '⚠️ 来源链接不合法', 'warn');
    ssoInfo = null;
    return;
  }
  try {
    var info = await api('/sso/info?redirect=' + encodeURIComponent(redirect));
    if (info && info.appName) {
      // 合法来源（已登记/未登记均返回 appName）：弹窗模式自动关窗回传；非弹窗整页回跳
      setSsoBanner(isPopup
        ? '登录后自动返回 <b>' + escapeHtml(info.appName) + '</b>（窗口将自动关闭）'
        : '登录后自动返回 <b>' + escapeHtml(info.appName) + '</b>');
      ssoInfo = info;
    } else {
      // 非法来源兜底提示（前端已先校验协议，正常不会走到这里）；不阻止登录与回跳，仅记录
      setSsoBanner('⚠️ ' + escapeHtml(info.reason || '来源链接不可用') + (isPopup
        ? '，登录后仍会回传结果 ' + closeBtn
        : '，登录后仍会尝试自动返回'), 'warn');
      ssoInfo = info;
    }
  } catch (e) {
    setSsoBanner(isPopup
      ? '⚠️ 暂时无法校验来源站点，登录后仍会回传结果 ' + closeBtn
      : '⚠️ 暂时无法校验来源站点，登录后仍会尝试自动返回', 'warn');
    ssoInfo = null;
  }
}

/* 整页回跳：把 token 追加到来源站 URL（落地页会立即清理 URL 中的 token） */
function redirectWithToken(url, token) {
  return url + (url.indexOf('?') > -1 ? '&' : '?') + 'token=' + encodeURIComponent(token);
}

/* 登录/注册成功后的统一结尾：存会话 + 弹窗模式回传关窗；
   非弹窗且来源链接合法（http/https）则整页回跳（手机端等无法用弹窗回传），否则进入账号中心 */
function applySession(data) {
  saveSession(data);
  if (deliverToken(data)) return; // 弹窗模式：已回传并关窗
  if (isPopup) return; // 弹窗模式但未满足回传条件：留在弹窗内（上方已有提示，用户可手动关闭）
  if (redirect && validateRedirect(redirect)) {
    location.href = redirectWithToken(redirect, data.token); // 整页回跳完成落地
    return;
  }
  location.href = 'account.html';
}

/* 已登录自动跳转：弹窗模式直接回传关窗；非弹窗按来源站整页回跳，无来源站则进入账号中心 */
async function autoRedirect() {
  var token = localStorage.getItem(LS_TOKEN);
  if (!token) return;
  try {
    var me = await api('/me');
    if (isPopup) {
      // 弹窗模式：满足条件即回传关窗；不满足则保留登录表单（不跳到 account.html）
      if (deliverToken({ token: token, userId: me.userId, nickname: me.nickname })) return;
      return;
    }
    if (redirect && validateRedirect(redirect)) {
      location.href = redirectWithToken(redirect, token); // 已登录 + 来源链接合法：整页回跳完成落地
      return;
    }
    location.href = 'account.html';
  } catch (e) { /* token 失效：app.js 已清 session，继续展示登录表单 */ }
}

async function doLogin(e) {
  e.preventDefault();
  var msg = document.getElementById('loginMsg');
  var btn = document.getElementById('loginBtn');
  msg.className = 'msg error';
  btn.disabled = true;
  msg.textContent = '登录中…';
  try {
    var data = await api('/login', {
      method: 'POST',
      body: JSON.stringify({
        nickname: document.getElementById('loginNick').value.trim(),
        password: document.getElementById('loginPass').value,
        client_id: (ssoInfo && ssoInfo.appId) ? ssoInfo.appId : null,
        sso_origin: (redirect && validateRedirect(redirect)) ? new URL(redirect).origin : null,
      }),
    });
    // 账号密码哈希为空：要求设置密码（切换到设密码表单，昵称以后端返回的真实昵称为准）
    if (data && data.need_set_password) {
      showSetPassForm(data.identity || document.getElementById('loginNick').value.trim());
      return false;
    }
    msg.className = 'msg ok';
    msg.textContent = '登录成功，正在跳转…';
    applySession(data);
  } catch (err) { msg.textContent = err.message; btn.disabled = false; }
  return false;
}

async function doRegister(e) {
  e.preventDefault();
  var msg = document.getElementById('regMsg');
  var btn = document.getElementById('regBtn');
  msg.className = 'msg error';
  if (document.getElementById('regPass').value !== document.getElementById('regPass2').value) {
    msg.textContent = '两次输入的密码不一致';
    return false;
  }
  btn.disabled = true;
  msg.textContent = '注册中…';
  try {
    var data = await api('/register', {
      method: 'POST',
      body: JSON.stringify({
        nickname: document.getElementById('regNick').value.trim(),
        password: document.getElementById('regPass').value,
        invite_code: document.getElementById('regInvite').value.trim(),
      }),
    });
    msg.className = 'msg ok';
    msg.textContent = '注册成功，正在进入…';
    applySession(data);
  } catch (err) { msg.textContent = err.message; btn.disabled = false; }
  return false;
}

/* 切换到"设置密码"视图（账号密码哈希为空时）：隐藏 tabs + 登录/注册表单，显示设密码表单 */
function showSetPassForm(nick) {
  document.querySelector('.tabs').style.display = 'none';
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('regForm').style.display = 'none';
  document.getElementById('setPassForm').style.display = '';
  document.getElementById('setPassNick').value = nick || '';
  document.getElementById('setPassNew').value = '';
  document.getElementById('setPassNew2').value = '';
  document.getElementById('authTitle').textContent = '🔑 设置密码';
  document.getElementById('authSubtitle').textContent = '该账号尚未设置密码，请先设置密码后登录';
  var btn = document.getElementById('loginBtn'); if (btn) btn.disabled = false;
  var msg = document.getElementById('setPassMsg');
  msg.className = 'msg'; msg.textContent = '';
  document.getElementById('setPassNew').focus();
}

/* 设置密码（账号哈希为空时首次设置）：成功后等同登录 */
async function doSetPassword(e) {
  e.preventDefault();
  var msg = document.getElementById('setPassMsg');
  var btn = document.getElementById('setPassBtn');
  msg.className = 'msg error';
  var p1 = document.getElementById('setPassNew').value;
  var p2 = document.getElementById('setPassNew2').value;
  if (p1 !== p2) { msg.textContent = '两次输入的密码不一致'; return false; }
  btn.disabled = true;
  msg.textContent = '设置中…';
  try {
    var data = await api('/set-password', {
      method: 'POST',
      body: JSON.stringify({
        nickname: document.getElementById('setPassNick').value.trim(),
        new_password: p1,
        sso_origin: (redirect && validateRedirect(redirect)) ? new URL(redirect).origin : null,
      }),
    });
    msg.className = 'msg ok';
    msg.textContent = '密码设置成功，正在进入…';
    applySession(data);
  } catch (err) { msg.textContent = err.message; btn.disabled = false; }
  return false;
}

/* ---------- 忘记密码 ---------- */

/* 进入「忘记密码」视图：隐藏 tabs + 其他表单，显示忘记密码表单 */
function showForgot() {
  resetAuthView();
  document.getElementById('forgotForm').style.display = '';
  document.getElementById('authTitle').textContent = '🔑 忘记密码';
  document.getElementById('authSubtitle').textContent = '通过你已绑定并验证的邮箱重置密码';
  document.getElementById('forgotEmail').focus();
}

/* 返回登录视图 */
function backToLogin() {
  resetAuthView();
  currentAuthMode = 'login';
  document.querySelector('.tabs').style.display = '';
  document.getElementById('tabLogin').classList.add('active');
  document.getElementById('tabReg').classList.remove('active');
  document.getElementById('loginForm').style.display = '';
  document.getElementById('authTitle').textContent = '👋 欢迎回来';
  document.getElementById('authSubtitle').textContent = '使用 Qxwk 通行证登录，一处登录，通行各站';
}

/* 统一重置：隐藏 tabs 与所有表单（登录/注册/设密码/忘记密码） */
function resetAuthView() {
  document.querySelector('.tabs').style.display = 'none';
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('regForm').style.display = 'none';
  document.getElementById('setPassForm').style.display = 'none';
  document.getElementById('forgotForm').style.display = 'none';
}

/* 发送重置验证码：成功后显示验证码输入行 + 倒计时 */
async function sendForgotCode() {
  var msg = document.getElementById('forgotMsg');
  var btn = document.getElementById('forgotSendBtn');
  var email = document.getElementById('forgotEmail').value.trim();
  msg.className = 'msg error';
  msg.textContent = '';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = '请先填写正确的邮箱地址'; return; }
  btn.disabled = true;
  msg.textContent = '发送中…';
  try {
    var data = await api('/forgot-send', { method: 'POST', body: JSON.stringify({ email }) });
    msg.className = 'msg ok';
    msg.textContent = (data && data.msg) || '发送成功，请查收';
    document.getElementById('forgotCodeRow').style.display = '';
    forgotCountdown(btn);
  } catch (err) { msg.textContent = err.message; btn.disabled = false; }
}

/* 发码按钮 60 秒倒计时 */
function forgotCountdown(btn) {
  var left = 60;
  btn.textContent = left + 's 后重发';
  var timer = setInterval(function () {
    left--;
    if (left <= 0) {
      clearInterval(timer);
      btn.disabled = false;
      btn.textContent = '重新发送验证码';
    } else {
      btn.textContent = left + 's 后重发';
    }
  }, 1000);
}

/* 提交重置：校验验证码与新密码，成功后等同登录 */
async function doForgotReset(e) {
  e.preventDefault();
  var msg = document.getElementById('forgotMsg');
  var btn = document.getElementById('forgotBtn');
  msg.className = 'msg error';
  var email = document.getElementById('forgotEmail').value.trim();
  var code = document.getElementById('forgotCode').value.trim();
  var p1 = document.getElementById('forgotNew').value;
  var p2 = document.getElementById('forgotNew2').value;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = '请先填写正确的邮箱地址'; return; }
  if (!code) { msg.textContent = '请输入验证码'; return; }
  if (p1 !== p2) { msg.textContent = '两次输入的密码不一致'; return; }
  btn.disabled = true;
  msg.textContent = '重置中…';
  try {
    var data = await api('/forgot-reset', {
      method: 'POST',
      body: JSON.stringify({ email, code, new_password: p1, new_password_confirm: p2 }),
    });
    msg.className = 'msg ok';
    msg.textContent = '密码已重置，正在登录…';
    applySession(data);
  } catch (err) { msg.textContent = err.message; btn.disabled = false; }
  return false;
}
fetch('/api/config').then(function (r) { return r.json(); }).then(function (cfg) {
  if (cfg && cfg.inviteCodeRequired === false) {
    var field = document.getElementById('inviteField');
    var input = document.getElementById('regInvite');
    field.style.display = 'none';
    input.required = false;
  }
  if (cfg && cfg.inviteRegisterEnabled === false) {
    var notice = document.getElementById('invitePausedNotice');
    if (notice) notice.style.display = '';
    var regBtn = document.getElementById('regBtn');
    if (regBtn) regBtn.disabled = true;
  }
}).catch(function () { /* 后端不可达时默认强制邀请码 */ });

/* 初始化顺序：先校验 SSO，再尝试已登录自动跳转 */
checkSso().then(autoRedirect);
