<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="login.title">登录 - Qxwk 通行证</title>
  <link rel="icon" href="favicon.webp" type="image/webp">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="/">
        <img class="brand-logo" src="favicon.webp" alt="">
        <span class="brand-text">
          <b data-i18n="login.welcome">Qxwk 通行证</b>
          <span data-i18n="common.slogan">一处登录，通行各站</span>
        </span>
      </a>
      <div class="navbar-actions">
        <button id="langToggle" class="lang-toggle" type="button" aria-label="切换语言">EN</button>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="切换主题" data-i18n-aria-label="common.theme">◐</button>
      </div>
    </div>
  </header>

  <main>
    <section class="card auth-card">
      <h1 class="page-title" data-i18n="login.welcome">Qxwk 通行证</h1>
      <p class="page-sub" data-i18n="login.sub">用一个通行证账号，登录所有 Qxwk 站点。</p>

      <div class="tabs" role="tablist">
        <button class="tab active" type="button" data-tab="password" data-i18n="login.tab_password">登录</button>
        <button class="tab" type="button" data-tab="code" data-i18n="login.tab_code">验证码登录</button>
        <button class="tab" type="button" data-tab="register" data-i18n="login.tab_register">注册</button>
      </div>

      <!-- 密码登录 -->
      <form id="loginForm" data-panel="password" novalidate>
        <div class="field">
          <label for="loginAccount" data-i18n="login.account">昵称或邮箱</label>
          <input class="input" id="loginAccount" name="account" autocomplete="username" data-i18n-placeholder="login.account_ph" placeholder="输入昵称或邮箱" required>
        </div>
        <div class="field">
          <label for="loginPassword" data-i18n="login.password">密码</label>
          <input class="input" id="loginPassword" name="password" type="password" autocomplete="current-password" data-i18n-placeholder="login.password_ph" placeholder="输入密码" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="login.submit">登录</button>
        <p class="msg" id="loginMsg"></p>
        <p class="auth-foot">
          <a href="#" id="forgotLink" data-i18n="login.forgot">忘记密码？</a>
        </p>
      </form>

      <!-- 邮箱验证码登录 -->
      <form id="codeLoginForm" data-panel="code" class="hidden" novalidate>
        <div class="field">
          <label for="codeLoginEmail" data-i18n="login.email">邮箱</label>
          <input class="input" id="codeLoginEmail" type="email" autocomplete="email" data-i18n-placeholder="login.email_ph" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="codeLoginCode" data-i18n="login.code">验证码</label>
          <div class="input-row">
            <input class="input" id="codeLoginCode" inputmode="numeric" maxlength="6" data-i18n-placeholder="login.code_ph" placeholder="6 位数字" required>
            <button class="btn btn-ghost" type="button" data-send="login" data-email-for="codeLoginEmail" data-i18n="common.send_code">获取验证码</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="login.code_login_submit">验证并登录</button>
        <p class="msg" id="codeLoginMsg"></p>
      </form>

      <!-- 邮箱注册 -->
      <form id="registerForm" data-panel="register" class="hidden" novalidate>
        <div class="field">
          <label for="regEmail" data-i18n="login.email">邮箱</label>
          <input class="input" id="regEmail" type="email" autocomplete="email" data-i18n-placeholder="login.email_ph" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="regCode" data-i18n="login.code">验证码</label>
          <div class="input-row">
            <input class="input" id="regCode" inputmode="numeric" maxlength="6" data-i18n-placeholder="login.code_ph" placeholder="6 位数字" required>
            <button class="btn btn-ghost" type="button" data-send="register" data-email-for="regEmail" data-i18n="common.send_code">获取验证码</button>
          </div>
        </div>
        <div class="field">
          <label for="regNickname" data-i18n="login.nickname">昵称</label>
          <input class="input" id="regNickname" autocomplete="nickname" maxlength="20" data-i18n-placeholder="login.nickname_ph" placeholder="1-20 个字符" required>
        </div>
        <div class="field">
          <label for="regPassword" data-i18n="login.password">密码</label>
          <input class="input" id="regPassword" type="password" autocomplete="new-password" data-i18n-placeholder="login.password_ph" placeholder="输入密码" required>
        </div>
        <div class="field">
          <label for="regPassword2" data-i18n="login.confirm_password">确认密码</label>
          <input class="input" id="regPassword2" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="login.register_submit">创建账号</button>
        <p class="msg" id="registerMsg"></p>
      </form>

      <!-- 重置密码 -->
      <form id="resetForm" class="hidden" novalidate>
        <h2 data-i18n="login.reset_title">重置密码</h2>
        <p class="muted" data-i18n="login.reset_sub">通过已绑定的邮箱重置密码。</p>
        <div class="field">
          <label for="resetEmail" data-i18n="login.email">邮箱</label>
          <input class="input" id="resetEmail" type="email" autocomplete="email" data-i18n-placeholder="login.email_ph" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="resetCode" data-i18n="login.code">验证码</label>
          <div class="input-row">
            <input class="input" id="resetCode" inputmode="numeric" maxlength="6" data-i18n-placeholder="login.code_ph" placeholder="6 位数字" required>
            <button class="btn btn-ghost" type="button" data-send="reset_password" data-email-for="resetEmail" data-i18n="common.send_code">获取验证码</button>
          </div>
        </div>
        <div class="field">
          <label for="resetPassword" data-i18n="login.new_password">新密码</label>
          <input class="input" id="resetPassword" type="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="resetPassword2" data-i18n="login.confirm_password">确认密码</label>
          <input class="input" id="resetPassword2" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="login.reset_submit">重置密码</button>
        <p class="msg" id="resetMsg"></p>
        <p class="auth-foot"><a href="#" id="backLogin" data-i18n="login.back_login">返回登录</a></p>
      </form>

      <p class="small" style="margin-top:18px" data-i18n="login.hint">密码只提交给 Qxwk 通行证，不经过第三方站点。</p>
    </section>
  </main>

  <footer data-i18n="common.copy">2026 青翔未阔工作室 · Qxwk 通行证</footer>

  <script src="app.js"></script>
  <script src="login.js"></script>
</body>
</html>
