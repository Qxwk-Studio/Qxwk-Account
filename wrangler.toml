name = "qxwk-account"
main = "src/worker.js"
compatibility_date = "2026-08-05"
compatibility_flags = ["nodejs_compat"]

# 关闭默认域（*.workers.dev），只保留自定义域 account.qxwkstudio.top
# 自定义域在控制台配置（Worker → 设置 → 触发器 → 自定义域，见 README「部署指南 §6」），
# 与 workers_dev 相互独立、不受影响；这里仅停用 workers.dev 子域，避免出现第二个可访问入口。
workers_dev = false

# 静态资源目录（public/）
#
# binding = "ASSETS"：把资源集合暴露给 Worker（env.ASSETS.fetch）。**不能省**——
#   没有它 env.ASSETS 就是 undefined，未命中静态资源的路径会直接抛异常（线上表现为 Cloudflare 1101）。
# run_worker_first = true：默认值 false 时「命中静态文件的请求由资源服务直接响应、不进 Worker」，
#   于是 / 与各 .html 都绕过 Worker，worker.js 里给 HTML 加的 CSP 等安全头根本不会生效。
#   置 true 后所有请求先过 Worker：/api/* 由代码处理，其余交给 env.ASSETS.fetch（未命中即正常 404）。
#   代价：js/css/图片等资源也过一次 Worker（略增延迟并计入 Worker 请求数），本项目量级可忽略。
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# D1 数据库绑定
# 部署前：在 CF 控制台创建 D1 数据库后，把 database_id 替换成你的数据库 ID
[[d1_databases]]
binding = "DB"
database_name = "qxwk-account"
database_id = "3308443b-b6b3-4011-a387-485d786208f7"

# Worker 缓存（控制台「Cache / 缓存」）
# enabled = true：为 fetch handler 返回的响应启用边缘缓存，缓存行为由响应自带的 Cache-Control 决定
#   （worker.js 已设：静态资源 public, max-age=300；HTML no-cache；/api/* no-store，即接口不进缓存）。
#   命中时直接由边缘返回、不再执行 Worker。
[cache]
enabled = true